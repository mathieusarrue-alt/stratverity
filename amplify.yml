version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22.13.0 && nvm use 22.13.0 && node --version
        - npm ci
    build:
      commands:
        - export NITRO_PRESET=aws_amplify
        - npx vite build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - "**/*"
  cache:
    paths:
      - ~/.npm/**/*
