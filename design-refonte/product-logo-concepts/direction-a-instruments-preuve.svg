<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Direction A — Instruments de preuve</title>
  <desc id="desc">Comparaison des pictogrammes Audit, Marketplace et Optimiseur en modes sombre et clair.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#00150f" flood-opacity=".28"/>
    </filter>
    <symbol id="audit-a" viewBox="0 0 120 120">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="60" cy="60" r="37" stroke-width="3" stroke-dasharray="74 18 52 88"/>
        <circle cx="60" cy="60" r="24" stroke-width="2" opacity=".55"/>
        <path d="M60 14v10M106 60H96M60 106V96M14 60h10" stroke-width="3"/>
        <path d="M46 64l10 10 24-30" stroke-width="5"/>
        <circle cx="80" cy="44" r="4" fill="currentColor" stroke="none"/>
      </g>
    </symbol>
    <symbol id="market-a" viewBox="0 0 120 120">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M37 41L53 55M83 41L67 55M60 71v16" stroke-width="3" opacity=".65"/>
        <rect x="17" y="19" width="34" height="28" rx="7" stroke-width="3"/>
        <rect x="69" y="19" width="34" height="28" rx="7" stroke-width="3"/>
        <rect x="43" y="79" width="34" height="24" rx="7" stroke-width="3"/>
        <path d="M49 60l8 8 15-19" stroke-width="5"/>
        <circle cx="60" cy="60" r="19" stroke-width="3"/>
      </g>
    </symbol>
    <symbol id="optimizer-a" viewBox="0 0 120 120">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <g opacity=".5" stroke-width="2.5">
          <rect x="19" y="19" width="21" height="21" rx="5"/><rect x="49.5" y="19" width="21" height="21" rx="5"/><rect x="80" y="19" width="21" height="21" rx="5"/>
          <rect x="19" y="49.5" width="21" height="21" rx="5"/><rect x="49.5" y="49.5" width="21" height="21" rx="5"/><rect x="80" y="49.5" width="21" height="21" rx="5"/>
          <rect x="19" y="80" width="21" height="21" rx="5"/><rect x="49.5" y="80" width="21" height="21" rx="5"/>
        </g>
        <path d="M29 29l30 30M90 29L63 56M29 90l27-27" stroke-width="3" opacity=".7"/>
        <rect x="78" y="78" width="25" height="25" rx="7" stroke-width="4"/>
        <path d="M84 90l6 6 9-12" stroke-width="3.5"/>
      </g>
    </symbol>
    <style>
      .display{font-family:Fraunces,Georgia,serif}.ui{font-family:Inter,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .card{fill:#0c2b21;stroke:#245543;stroke-width:1.5}.paperCard{fill:#fffdf8;stroke:#d8d5cb;stroke-width:1.5}
      .title{font-size:34px;font-weight:650;fill:#f6f3ec}.sub{font-size:15px;fill:#b7ccc2}.label{font-size:20px;font-weight:700;fill:#f6f3ec}.copy{font-size:13px;fill:#9fbaad}
      .lightLabel{font-size:16px;font-weight:700;fill:#083326}.tag{font-size:12px;font-weight:800;letter-spacing:.14em;fill:#5fe3b0}
    </style>
  </defs>
  <rect width="1200" height="500" fill="#071e17"/>
  <rect y="500" width="1200" height="220" fill="#f6f3ec"/>
  <text x="48" y="58" class="ui tag">DIRECTION A · RECOMMANDÉE</text>
  <text x="48" y="105" class="display title">Instruments de preuve</text>
  <text x="48" y="136" class="ui sub">Mesurer · relier · sélectionner — sans promesse de performance.</text>

  <g filter="url(#shadow)">
    <rect class="card" x="48" y="175" width="320" height="275" rx="24"/>
    <rect class="card" x="440" y="175" width="320" height="275" rx="24"/>
    <rect class="card" x="832" y="175" width="320" height="275" rx="24"/>
  </g>
  <g color="#5fe3b0"><use href="#audit-a" x="148" y="196" width="120" height="120"/></g>
  <g color="#16b981"><use href="#market-a" x="540" y="196" width="120" height="120"/></g>
  <g color="#5fe3b0"><use href="#optimizer-a" x="932" y="196" width="120" height="120"/></g>
  <text x="208" y="350" text-anchor="middle" class="ui label">Audit</text>
  <text x="208" y="378" text-anchor="middle" class="ui copy">Calibration + validation</text>
  <text x="600" y="350" text-anchor="middle" class="ui label">Marketplace</text>
  <text x="600" y="378" text-anchor="middle" class="ui copy">Produits reliés à une preuve</text>
  <text x="992" y="350" text-anchor="middle" class="ui label">Optimiseur</text>
  <text x="992" y="378" text-anchor="middle" class="ui copy">Explorer puis sélectionner</text>

  <text x="48" y="548" class="ui" font-size="13" font-weight="800" letter-spacing=".12em" fill="#12604a">APERÇU MODE CLAIR · 24–48 PX</text>
  <g>
    <rect class="paperCard" x="48" y="574" width="320" height="102" rx="18"/>
    <rect class="paperCard" x="440" y="574" width="320" height="102" rx="18"/>
    <rect class="paperCard" x="832" y="574" width="320" height="102" rx="18"/>
  </g>
  <g color="#0e4a38"><use href="#audit-a" x="70" y="593" width="64" height="64"/><use href="#market-a" x="462" y="593" width="64" height="64"/><use href="#optimizer-a" x="854" y="593" width="64" height="64"/></g>
  <text x="154" y="632" class="ui lightLabel">Audit</text><text x="546" y="632" class="ui lightLabel">Marketplace</text><text x="938" y="632" class="ui lightLabel">Optimiseur</text>
</svg>
